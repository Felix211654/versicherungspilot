# Lokale Infrastruktur (Entwicklung). App/Worker laufen per npm run dev / npm run worker.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vp
      POSTGRES_PASSWORD: vp_dev_pw
      POSTGRES_DB: versicherungspilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    profiles: ["security"]
volumes:
  pgdata:
