# Veröffentlicht WEINMASTER 60 (weinmaster60/dist) auf GitHub Pages.
# Einmalig: Repository → Settings → Pages → Source: „GitHub Actions“. Danach manuell starten (Actions → „WEINMASTER 60 Pages“ → Run workflow).
name: WEINMASTER 60 Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weinmaster60-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node weinmaster60/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: weinmaster60/dist
      - id: deployment
        uses: actions/deploy-pages@v4
